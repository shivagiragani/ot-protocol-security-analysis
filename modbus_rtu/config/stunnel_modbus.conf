# stunnel_modbus.conf
# Compensating transport-layer control for Modbus/TCP, which has no native
# encryption. Run on the PLC side (server block) and on the client/HMI side
# (client block) as two separate stunnel instances, or two config files.
#
# Generate a cert first:
#   openssl req -new -x509 -days 365 -nodes -out modbus.pem -keyout modbus.pem

; --- Server-side (in front of the real OpenPLC, port 502) ---
[modbus-server]
accept = 802
connect = 127.0.0.1:502
cert = /etc/stunnel/modbus.pem
key = /etc/stunnel/modbus.pem

; --- Client-side (on the Management/FUXA host) ---
; Put this in a SEPARATE config file run on the client machine instead:
;
; [modbus-client]
; client = yes
; accept = 127.0.0.1:502
; connect = 192.168.100.x:802
; verify = 2
; CAfile = /etc/stunnel/modbus-ca.pem
